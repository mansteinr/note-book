
<!DOCTYPE html>
<html>
<head>
  <title>flex-shrink示例</title>
  <style>
    .container {
      display: flex;
      width: 450px;
      border: 2px solid #333;
      margin-bottom: 20px;
      background-color: #f0f0f0;
      background-color: yellow;
    }
    .item {
      box-sizing: border-box;
      /* padding: 20px; */
      text-align: center;
      color: white;
      font-weight: bold;
      flex-basis: 200px;
      height: 100px;
    }
    .item1 { 
      flex-shrink: .1;
      background-color: #3498db; 
    }
    .item2 {
      flex-shrink:.2;
       background-color: #2ecc71; 
      }
    .item3 { 
      flex-shrink:.3;
      background-color: #e74c3c;
     }
  </style>
</head>
<body>
  <div class="container">
    <div class="item item1">1 (flex-shrink:0)</div>
    <div class="item item2">2 (flex-shrink:1)</div>
    <div class="item item3">3 (flex-shrink:4)</div>
  </div>
</body>
</html>
